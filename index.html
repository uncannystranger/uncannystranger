  <!-- Prevent white flash: default background applied to <html> and a dark override when .dark is present -->
  <style>
    html {
      background-color: #F3E9DC;
      color: #5E3023;
      color-scheme: light;
    }

    html.dark {
      background-color: #5E3023;
      color: #F3E9DC;
      color-scheme: dark;
    }

    body {
      background-color: inherit;
      color: inherit;
    }
  </style>
  <script>
    (() => {
      try {
        const stored = localStorage.getItem('uncanny-theme-mode');
        const hasManualTheme = localStorage.getItem('uncanny-theme-manual') === 'true';
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        const dark = hasManualTheme && stored === 'dark'
          ? true
          : hasManualTheme && stored === 'light'
            ? false
            : prefersDark;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.dataset.theme = 'light';
        }
      }
    })();
  </script>
